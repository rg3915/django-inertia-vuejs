[project]
name = "django-inertia-vuejs"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "django-extensions>=4.1",
    "django-vite>=3.1.0",
    "inertia-django>=2.0.0",
    "psycopg[binary]>=3.3.4",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.ruff.format]
quote-style = "single"
